name: secrets

# The repository is public and the packaged build bakes a Google OAuth client
# into the source tree, so a credential can reach a commit by accident. The
# pre-commit hook catches that locally; this catches it when the hook was not
# installed. No project dependencies: the check must not be skippable because
# an install failed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan tracked files for Google OAuth credentials
        run: python scripts/check_no_secrets.py --all

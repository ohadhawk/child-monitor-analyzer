[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "child-monitor-analyzer"
version = "1.2.0"
description = "Child audio monitoring tool — detects profanity, shouting, crying and more with precise timestamps"
requires-python = ">=3.10"
dependencies = [
    # Upper bounds are deliberate: an uncapped range lets a single upstream
    # release land in the next fresh install with no review. See the header of
    # requirements.txt, and requirements.lock for the hash-pinned set.
    "faster-whisper>=1.2.1,<2",
    "librosa>=0.11.0,<0.12",
    "torch>=2.11.0,<3",
    "transformers>=5.5.4,<6",
    "PySide6>=6.11.0,<7",
    "numpy>=2.4.4,<3",
    "python-docx>=1.2.0,<2",
    "keyring>=25.6.0,<26",
    # Security floors for transitive packages -- see requirements.txt for the
    # advisory references.
    "urllib3>=2.7.0",
    "idna>=3.15",
    "msgpack>=1.2.1",
]

[project.scripts]
monitor = "monitor.cli:main"
monitor-gui = "monitor.gui.main_window:run_gui"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0",
    "pip-audit>=2.7",
    "pip-tools>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"monitor.vendor.panns" = ["LICENSE-third-party.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: test needs the large downloaded model files",
    "network: test performs real network access",
]
